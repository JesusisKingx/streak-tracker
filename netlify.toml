# Netlify deploy config.
# Connect this repo at app.netlify.com and it will pick these up automatically.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for any unmatched path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
